
services:
  telegram-echo:
    build: .
    command: python3 -u /app/generate_session.py
    environment:
      - API_ID=${API_ID}
      - API_HASH=${API_HASH}
      - SESSION_STRING=${SESSION_STRING}

  lint:
    image: tts-grpc-service/lint-base:latest
    working_dir: /app
    volumes:
      - ../:/app:cached